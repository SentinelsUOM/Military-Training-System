<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinels — After Action Review</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════
   VARIABLES & RESET
════════════════════════════════════════════════ */
:root {
  --bg:      #0d1117;
  --card:    #161b22;
  --border:  #30363d;
  --accent:  #1f6feb;
  --success: #3fb950;
  --warning: #d29922;
  --danger:  #f85149;
  --text:    #e6edf3;
  --muted:   #8b949e;
  --purple:  #a371f7;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', 'Courier New', monospace;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}
input[type=range] { accent-color: var(--accent); }

/* ════════════════════════════════════════════════
   LANDING STATE
════════════════════════════════════════════════ */
#landing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  text-align: center;
}
.logo-wordmark {
  font-size: 3.2rem;
  font-weight: 700;
  letter-spacing: 0.25em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.logo-sub {
  font-size: 0.78rem;
  letter-spacing: 0.35em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 56px;
}
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 14px;
  padding: 64px 80px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  max-width: 480px;
  width: 100%;
  position: relative;
}
.drop-zone:hover,
.drop-zone.drag-over {
  border-color: var(--accent);
  background: rgba(31,111,235,0.05);
}
.drop-icon { font-size: 2.8rem; margin-bottom: 18px; opacity: 0.6; }
.drop-title {
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.drop-hint { font-size: 0.82rem; color: var(--muted); }
.drop-note { margin-top: 24px; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.05em; }

/* ════════════════════════════════════════════════
   DASHBOARD LAYOUT
════════════════════════════════════════════════ */
#dashboard { display: flex; flex-direction: column; min-height: 100vh; }

/* Header */
#main-header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 200;
  flex-wrap: wrap;
}
.hdr-brand {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--accent);
  white-space: nowrap;
}
.hdr-session {
  flex: 1;
  text-align: center;
  min-width: 0;
  font-size: 0.78rem;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hdr-session strong { color: var(--text); font-size: 0.9rem; }
.hdr-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.hdr-date { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

/* Tab bar */
#tab-bar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  padding: 0 20px;
  gap: 2px;
  overflow-x: auto;
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  padding: 12px 20px;
  cursor: pointer;
  text-transform: uppercase;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Content */
#content {
  flex: 1;
  padding: 24px;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ════════════════════════════════════════════════
   SHARED COMPONENTS
════════════════════════════════════════════════ */

/* Buttons */
.btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 5px 14px;
  border-radius: 6px;
  cursor: pointer;
  text-transform: uppercase;
  white-space: nowrap;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { opacity: 0.85; color: #fff; }
.btn.active-filter { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
}
.card-title {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

/* Badges */
.badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 4px;
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.badge-success { background: rgba(63,185,80,0.12);  color: var(--success); border: 1px solid var(--success); }
.badge-danger  { background: rgba(248,81,73,0.12);  color: var(--danger);  border: 1px solid var(--danger); }

.sev-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 3px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.sev-high   { background: rgba(248,81,73,0.15);  color: var(--danger);  border: 1px solid var(--danger); }
.sev-medium { background: rgba(210,153,34,0.15); color: var(--warning); border: 1px solid var(--warning); }
.sev-low    { background: rgba(31,111,235,0.15); color: var(--accent);  border: 1px solid var(--accent); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th {
  background: #21262d;
  color: var(--muted);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 8px 12px;
  text-align: left;
  white-space: nowrap;
}
td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

.stat-table td:first-child { color: var(--muted); width: 52%; }
.stat-table td:last-child  { font-weight: 600; }

/* Bars */
.bar-row { margin-bottom: 13px; }
.bar-label-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.82rem;
  margin-bottom: 5px;
}
.bar-label-row span:first-child { color: var(--muted); }
.bar-label-row span:last-child  { font-weight: 700; }
.bar-track { background: #21262d; border-radius: 4px; height: 10px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 4px; }
.bar-safety   { background: var(--success); }
.bar-accuracy { background: var(--warning); }
.bar-speed    { background: var(--purple); }
.bar-overall  { background: var(--accent); }

/* Misc */
.gap { margin-bottom: 16px; }
.text-muted { color: var(--muted); font-size: 0.85rem; }
.empty-state { text-align: center; color: var(--muted); padding: 48px; font-size: 0.88rem; }

/* ════════════════════════════════════════════════
   SUMMARY TAB
════════════════════════════════════════════════ */
.metric-row {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 14px;
  margin-bottom: 20px;
}
.metric-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
}
.metric-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.metric-value {
  font-size: 2.4rem;
  font-weight: 700;
  line-height: 1;
}
.mv-overall  { color: var(--accent); }
.mv-safety   { color: var(--success); }
.mv-accuracy { color: var(--warning); }
.mv-speed    { color: var(--purple); }

.grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.cog-level {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 3px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
}

/* ════════════════════════════════════════════════
   TIMELINE TAB
════════════════════════════════════════════════ */
.timeline-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 16px;
}
.timeline-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 16px;
  font-size: 0.8rem;
}
.legend-item { display: flex; align-items: center; gap: 7px; color: var(--muted); }
.legend-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

.timeline-detail {
  margin-top: 12px;
  padding: 12px 16px;
  background: #1c2128;
  border-radius: 6px;
  border-left: 3px solid var(--accent);
  font-size: 0.85rem;
  display: none;
}
.timeline-detail.visible { display: block; }

.ev-combat  td { background: rgba(248,81,73,0.07); }
.ev-door    td { background: rgba(210,153,34,0.07); }
.ev-hostage td { background: rgba(63,185,80,0.07); }
.ev-npc     td { background: rgba(31,111,235,0.07); }

/* ════════════════════════════════════════════════
   INCIDENTS TAB
════════════════════════════════════════════════ */
.incident-row { cursor: pointer; }
.incident-row:hover td { background: rgba(31,111,235,0.06); }
.incident-row.highlighted td { background: rgba(31,111,235,0.14); }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

/* ════════════════════════════════════════════════
   HOSTAGE TAB
════════════════════════════════════════════════ */
.hostage-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 14px;
}
.hostage-name {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.state-bar {
  display: flex;
  height: 26px;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 12px;
}
.state-seg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  overflow: hidden;
  white-space: nowrap;
  padding: 0 4px;
  color: rgba(255,255,255,0.85);
  transition: flex 0.3s;
}
.st-calm    { background: #2d5a38; }
.st-fearful { background: #5a4415; }
.st-panic   { background: #5a2020; }
.st-freeze  { background: #1e3a5a; }
.st-follow  { background: #183a5a; border: 1px solid var(--accent); }
.st-unknown { background: #2a2a2a; }

.distress-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
.distress-track { background: #21262d; border-radius: 4px; height: 8px; margin-bottom: 14px; overflow: hidden; }
.distress-fill  {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--success) 0%, var(--warning) 55%, var(--danger) 100%);
}
.trigger-list { font-size: 0.8rem; }
.trigger-item {
  padding: 3px 0;
  display: flex;
  gap: 8px;
  align-items: baseline;
  color: var(--muted);
}
.trigger-item::before { content: '▸'; color: var(--accent); flex-shrink: 0; }
.trigger-time { color: var(--accent); font-weight: 600; min-width: 38px; }
.trigger-state { color: var(--text); font-weight: 600; }

/* ════════════════════════════════════════════════
   REPLAY TAB
════════════════════════════════════════════════ */
.replay-controls {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 14px;
}
.replay-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 8px;
}
.phase-badge {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--warning);
  padding: 3px 12px;
  border: 1px solid var(--warning);
  border-radius: 4px;
  background: rgba(210,153,34,0.1);
}
.scrub-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.scrub-bar { flex: 1; height: 6px; cursor: pointer; }
.time-display {
  font-size: 0.82rem;
  color: var(--text);
  font-weight: 700;
  white-space: nowrap;
  min-width: 110px;
  text-align: right;
}
.replay-btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.speed-label { font-size: 0.78rem; color: var(--muted); margin-left: 4px; }

.active-events-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 14px;
  min-height: 72px;
}
.active-event-item {
  padding: 6px 10px;
  border-radius: 4px;
  margin-bottom: 4px;
  font-size: 0.84rem;
  border-left: 3px solid var(--accent);
  background: rgba(31,111,235,0.08);
}

.actor-board {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}
.actor-card {
  background: #1c2128;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
}
.actor-id    { font-size: 0.72rem; color: var(--muted); margin-bottom: 3px; letter-spacing: 0.05em; }
.actor-state { font-weight: 700; font-size: 0.95rem; }
.as-idle        { color: var(--muted); }
.as-suspicious  { color: #f0b030; }
.as-alert       { color: var(--warning); }
.as-engage      { color: var(--danger); }
.as-takecover   { color: #e06040; }
.as-reposition  { color: #c08040; }
.as-calm        { color: var(--success); }
.as-fearful     { color: var(--warning); }
.as-panic       { color: var(--danger); }
.as-freeze      { color: #5090c0; }
.as-follow      { color: var(--accent); }

.npc-log-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

/* ════════════════════════════════════════════════
   PRINT STYLES
════════════════════════════════════════════════ */
@media print {
  #landing { display: none !important; }

  #main-header {
    position: static;
    background: #f0f0f0;
    border-bottom: 1px solid #ccc;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .hdr-brand { color: #003399; }
  .hdr-date, .hdr-session { color: #333; }
  .btn, #tab-bar { display: none !important; }

  .tab-panel { display: block !important; }
  .tab-panel + .tab-panel { page-break-before: always; margin-top: 32px; }

  body { background: #fff; color: #111; }
  .card, .metric-card, .hostage-card, .replay-controls, .active-events-panel, .npc-log-wrap {
    background: #f8f9fa;
    border: 1px solid #ccc;
    break-inside: avoid;
  }
  .metric-value, .mv-overall, .mv-safety, .mv-accuracy, .mv-speed { color: #111 !important; }
  .bar-track { background: #ddd; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar-fill  { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  th { background: #e8e8e8 !important; color: #333 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  td { color: #111; border-color: #ccc; }
  .card-title, .hdr-session, .text-muted { color: #555; }
  .state-seg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .distress-fill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sev-badge, .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .replay-controls .scrub-row, .replay-btn-row { display: none; }
}

/* ════════════════════════════════════════════════
   RESPONSIVE
════════════════════════════════════════════════ */
@media (max-width: 900px) {
  .metric-row { grid-template-columns: repeat(2, 1fr); }
  .grid-2x2   { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .metric-row   { grid-template-columns: repeat(2, 1fr); }
  #content      { padding: 12px; }
  .drop-zone    { padding: 40px 24px; }
  .logo-wordmark { font-size: 2.2rem; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     LANDING STATE
═══════════════════════════════════════════ -->
<div id="landing">
  <div class="logo-wordmark">SENTINELS</div>
  <div class="logo-sub">After Action Review · Module 4</div>

  <div class="drop-zone" id="drop-zone" role="button" tabindex="0" aria-label="Drop session JSON or click to browse">
    <div class="drop-icon">📋</div>
    <div class="drop-title">Drop session JSON here</div>
    <div class="drop-hint">or click to browse files</div>
  </div>
  <input type="file" id="file-input" accept=".json" style="display:none" aria-label="Select session JSON file">

  <p class="drop-note">University of Moratuwa · 2026</p>
</div>

<!-- ═══════════════════════════════════════════
     DASHBOARD STATE
═══════════════════════════════════════════ -->
<div id="dashboard" hidden>

  <!-- Fixed header -->
  <header id="main-header">
    <div class="hdr-brand">AAR // SENTINELS</div>

    <div class="hdr-session">
      <strong id="hdr-session-id">—</strong><br>
      <span id="hdr-scenario-id">—</span>
    </div>

    <div class="hdr-right">
      <span class="hdr-date" id="hdr-date"></span>
      <span id="hdr-badge"></span>
      <button class="btn" id="copy-id-btn" title="Copy Session ID">⧉ Copy ID</button>
      <button class="btn" id="export-pdf-btn">⎙ Export PDF</button>
      <button class="btn primary" id="load-new-btn">↺ Load New</button>
    </div>
  </header>

  <!-- Tab navigation -->
  <nav id="tab-bar" role="tablist" aria-label="Dashboard sections">
    <button class="tab-btn active" onclick="showTab('summary')"   role="tab">Summary</button>
    <button class="tab-btn"        onclick="showTab('timeline')"  role="tab">Timeline</button>
    <button class="tab-btn"        onclick="showTab('incidents')" role="tab">Incidents</button>
    <button class="tab-btn"        onclick="showTab('hostage')"   role="tab">Hostage</button>
    <button class="tab-btn"        onclick="showTab('replay')"    role="tab">Replay</button>
  </nav>

  <!-- Tab panels -->
  <main id="content" role="main">
    <div id="tab-summary"   class="tab-panel active" role="tabpanel"></div>
    <div id="tab-timeline"  class="tab-panel"        role="tabpanel"></div>
    <div id="tab-incidents" class="tab-panel"        role="tabpanel"></div>
    <div id="tab-hostage"   class="tab-panel"        role="tabpanel"></div>
    <div id="tab-replay"    class="tab-panel"        role="tabpanel"></div>
  </main>

</div><!-- #dashboard -->

<!-- ═══════════════════════════════════════════
     ALL JAVASCRIPT
═══════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ──────────────────────────────────────────
     STATE
  ────────────────────────────────────────── */
  var S            = null;   // Current SessionSummary
  var totalDur     = 0;      // Mission duration in seconds
  var replayTimer  = null;   // requestAnimationFrame handle
  var replayTime   = 0;
  var replaySpeed  = 1;
  var isPlaying    = false;
  var replayReady  = false;  // Controls initialised at least once

  /* ──────────────────────────────────────────
     INIT
  ────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', function () {
    initDropZone();
    document.getElementById('load-new-btn')  .addEventListener('click',  resetToLanding);
    document.getElementById('export-pdf-btn').addEventListener('click',  function () { window.print(); });
    document.getElementById('copy-id-btn')   .addEventListener('click',  copySessionId);
  });

  /* ──────────────────────────────────────────
     DROP ZONE
  ────────────────────────────────────────── */
  function initDropZone() {
    var zone  = document.getElementById('drop-zone');
    var input = document.getElementById('file-input');

    zone.addEventListener('click',    function () { input.click(); });
    zone.addEventListener('keydown',  function (e) { if (e.key === 'Enter' || e.key === ' ') input.click(); });

    zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave',function ()  { zone.classList.remove('drag-over'); });
    zone.addEventListener('drop',     function (e) {
      e.preventDefault();
      zone.classList.remove('drag-over');
      var file = e.dataTransfer.files[0];
      if (file) readFile(file);
    });

    input.addEventListener('change', function () {
      if (input.files[0]) readFile(input.files[0]);
    });
  }

  function readFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var data = JSON.parse(e.target.result);
        loadSession(data);
      } catch (err) {
        alert('Could not parse JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  function resetToLanding() {
    S = null;
    stopReplay();
    replayReady = false;
    document.getElementById('landing').hidden   = false;
    document.getElementById('dashboard').hidden = true;
    document.getElementById('file-input').value = '';
  }

  /* ──────────────────────────────────────────
     LOAD SESSION
  ────────────────────────────────────────── */
  function loadSession(data) {
    S = data || {};
    var perf = S.performance || {};

    // Derive total duration
    totalDur = perf.missionDuration || 0;
    if (totalDur === 0) {
      var evts = S.events || [];
      evts.forEach(function (e) { if ((e.timestamp||0) > totalDur) totalDur = e.timestamp; });
    }
    if (totalDur === 0) totalDur = 1;

    // Update header
    document.getElementById('hdr-session-id').textContent  = 'Session: '  + (S.sessionId  || 'N/A');
    document.getElementById('hdr-scenario-id').textContent = 'Scenario: ' + (S.scenarioId || 'N/A');

    var dateStr = S.timestamp ? new Date(S.timestamp).toLocaleString() : 'N/A';
    document.getElementById('hdr-date').textContent = dateStr;

    var badge = document.getElementById('hdr-badge');
    badge.innerHTML = perf.missionSuccess
      ? '<span class="badge badge-success">Mission Success</span>'
      : '<span class="badge badge-danger">Mission Failed</span>';

    // Build panels
    buildSummary();
    buildTimeline();
    buildIncidents();
    buildHostagePanel();
    buildReplayShell();

    // Switch to dashboard
    document.getElementById('landing').hidden   = true;
    document.getElementById('dashboard').hidden = false;
    showTab('summary');
  }

  ────────────────────────────────────────── */
  function showTab(name) {
    document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
    document.querySelectorAll('.tab-btn').forEach(function (b)   { b.classList.remove('active'); });

    var panel = document.getElementById('tab-' + name);
    if (panel) panel.classList.add('active');

    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      if (btn.textContent.trim().toLowerCase() === name) btn.classList.add('active');
    });

    if (name === 'replay' && !replayReady) initReplayControls();
  }

  function buildSVGTimeline(events, dur) {
    if (!events.length) return '<p class="empty-state">No events to display</p>';
    var W = 1160, H = 100, pad = 20, lineY = 48;
    var D = Math.max(dur, 1);

    // Time markers (9 ticks)
    var marks = '';
    for (var i = 0; i <= 8; i++) {
      var t = (D / 8) * i;
      var x = pad + (t / D) * W;
      marks +=
        '<line x1="' + x + '" y1="' + (lineY-4) + '" x2="' + x + '" y2="' + (lineY+4) + '" stroke="#30363d" stroke-width="1"/>' +
        '<text x="' + x + '" y="' + (lineY+20) + '" text-anchor="middle" fill="#8b949e" font-size="11" font-family="Courier New,monospace">' + formatTime(t) + '</text>';
    }

    // Dots
    var dots = events.map(function(e, i) {
      var x   = pad + (Math.min(e.timestamp, D) / D) * W;
      var col = catColor(getEvtCat(e.eventType));
      return '<circle class="tl-dot" data-idx="' + i + '" cx="' + x + '" cy="' + lineY + '" r="7"' +
        ' fill="' + col + '" stroke="#0d1117" stroke-width="2"' +
        ' style="cursor:pointer"' +
        ' onmouseover="this.setAttribute(\'r\',\'10\')" onmouseout="this.setAttribute(\'r\',\'7\')"' +
        ' role="button" tabindex="0" aria-label="' + esc(e.eventType) + ' at ' + formatTime(e.timestamp) + '"' +
        '/>';
    }).join('');

    return '<div style="overflow-x:auto">' +
      '<svg viewBox="0 0 1200 ' + H + '" width="100%" style="min-width:600px;display:block;margin:8px 0">' +
        '<line x1="' + pad + '" y1="' + lineY + '" x2="' + (W+pad) + '" y2="' + lineY + '" stroke="#30363d" stroke-width="2"/>' +
        marks + dots +
      '</svg></div>';
  }

  function legendItem(label, color) {
    return '<div class="legend-item"><div class="legend-dot" style="background:' + color + '"></div><span>' + label + '</span></div>';
  }

  /* ──────────────────────────────────────────

  ────────────────────────────────────────── */
  function buildHostagePanel() {

  function buildHostagePanelContent(history) {
    var panel = document.getElementById('tab-hostage');
    if (!history.length) { panel.innerHTML = '<div class="empty-state">No hostage data recorded</div>'; return; }

    // Group by hostageId
    var groups = {};
    history.forEach(function(h) {
      var id = h.hostageId || 'unknown';
      if (!groups[id]) groups[id] = [];
      groups[id].push(h);
    });

    var cards = Object.keys(groups).sort().map(function(id) {
      var entries = groups[id].slice().sort(function(a,b){ return a.timestamp - b.timestamp; });
      var last    = entries[entries.length - 1];
      var distress = Math.max(0, Math.min(1, last.distressScore || 0));
      var dpct    = Math.round(distress * 100);
      var maxT    = Math.max(last.timestamp, 1);

      // State bar segments
      var segs = entries.map(function(e, i) {
        var segEnd = i + 1 < entries.length ? entries[i+1].timestamp : maxT;
        var frac   = Math.max(0.03, (segEnd - e.timestamp) / maxT);
        var stCls  = 'st-' + (e.state||'unknown').toLowerCase();
        return '<div class="state-seg ' + stCls + '" style="flex:' + frac.toFixed(3) + '" title="' + esc(e.state) + ' @ ' + formatTime(e.timestamp) + '">' +
          '<span>' + esc(e.state||'?') + '</span>' +
        '</div>';
      }).join('');

      // Trigger list
      var triggers = entries.filter(function(e){ return e.triggerEvent; }).map(function(e) {
        return '<div class="trigger-item">' +
          '<span class="trigger-time">' + formatTime(e.timestamp) + '</span>' +
          '<span class="trigger-state">' + esc(e.state) + '</span>' +
          '<span style="color:var(--muted)">← ' + esc(e.triggerEvent) + '</span>' +
        '</div>';
      }).join('');

      var dc = distress < 0.33 ? 'var(--success)' : distress < 0.6 ? 'var(--warning)' : 'var(--danger)';

      return '<div class="hostage-card">' +
        '<div class="hostage-name">' +
          '<span>&#9679; ' + esc(id) + '</span>' +
          '<span class="badge" style="background:' + dc + '22;color:' + dc + ';border:1px solid ' + dc + '">Distress: ' + dpct + '%</span>' +
        '</div>' +
        '<div class="state-bar">' + segs + '</div>' +
        '<div class="distress-sub">Final distress score — ' + distress.toFixed(2) + '</div>' +
        '<div class="distress-track"><div class="distress-fill" style="width:' + dpct + '%"></div></div>' +
        (triggers ? '<div class="trigger-list">' + triggers + '</div>' : '') +
      '</div>';
    }).join('');

    panel.innerHTML = cards;
  }

  function initReplayControls() {
    replayReady = true;
    replayTime  = 0;
    isPlaying   = false;

    var scrub   = document.getElementById('scrub-bar');
    var playBtn = document.getElementById('play-pause-btn');
    var rewBtn  = document.getElementById('rewind-btn');
    if (!scrub) return;

    scrub.max   = totalDur;
    scrub.value = 0;

    scrub.addEventListener('input', function() {
      replayTime = parseFloat(scrub.value);
      updateReplayView(replayTime);
    });

    playBtn.addEventListener('click', togglePlay);
    rewBtn .addEventListener('click', function() {
      replayTime = Math.max(0, replayTime - 10);
      scrub.value = replayTime;
      updateReplayView(replayTime);
    });

    updateReplayView(0);
  }

  /* ──────────────────────────────────────────
     REPLAY — PLAYBACK
  ────────────────────────────────────────── */
  function togglePlay() {
    isPlaying = !isPlaying;
    var btn = document.getElementById('play-pause-btn');
    if (btn) btn.innerHTML = isPlaying ? '&#9646;&#9646; Pause' : '&#9654; Play';
    if (isPlaying) startReplayLoop(); else stopReplay();
  }

  function startReplayLoop() {
    stopReplay();
    var last = performance.now();
    function tick(now) {
      if (!isPlaying) return;
      var dt = (now - last) / 1000;
      last = now;
      replayTime = Math.min(replayTime + dt * replaySpeed, totalDur);
      var scrub = document.getElementById('scrub-bar');
      if (scrub) scrub.value = replayTime;
      updateReplayView(replayTime);
      if (replayTime >= totalDur) {
        isPlaying = false;
        var btn = document.getElementById('play-pause-btn');
        if (btn) btn.innerHTML = '&#9654; Play';
        return;
      }
      replayTimer = requestAnimationFrame(tick);
    }
    replayTimer = requestAnimationFrame(tick);
  }

  function stopReplay() {
    if (replayTimer) { cancelAnimationFrame(replayTimer); replayTimer = null; }
    isPlaying = false;
  }

  function setSpeed(s) {
    replaySpeed = s;
    ['sp-05','sp-1','sp-2'].forEach(function(id) {
      var b = document.getElementById(id);
      if (b) b.classList.remove('active-filter');
    });
    var map = { 0.5: 'sp-05', 1: 'sp-1', 2: 'sp-2' };
    var b = document.getElementById(map[s]);
    if (b) b.classList.add('active-filter');
  }

  /* ──────────────────────────────────────────
     REPLAY — VIEW UPDATE
  ────────────────────────────────────────── */
  function updateReplayView(t) {
    var td = document.getElementById('time-display');
    if (td) td.textContent = formatTime(t) + ' / ' + formatTime(totalDur);

    var pb = document.getElementById('phase-badge');
    if (pb) pb.textContent = getMissionPhase(t);

    buildActorBoard(t, S.npcStateChanges || []);
    updateActiveEvents(t);
    updateNPCLog(t);
  }

  function getMissionPhase(t) {
    var evts = (S.events || []).filter(function(e){ return e.timestamp <= t; });
    if (evts.some(function(e){ return e.eventType === 'HostageFreed'; }))     return 'EXTRACTION';
    if (evts.some(function(e){ return e.eventType === 'TerroristDown'; }))    return 'CLEARING';
    if (evts.some(function(e){ return e.eventType === 'ShotFired' || e.eventType === 'PlayerSeen'; })) return 'ENGAGEMENT';
    if (evts.some(function(e){ return e.eventType === 'DoorOpened' || e.eventType === 'RoomBreached'; })) return 'INFILTRATION';
    return 'STANDBY';
  }

  function buildActorBoard(t, npcChanges) {
    var board = document.getElementById('actor-board');
    if (!board) return;
    var actors = uniqueVals(npcChanges.map(function(c){ return c.actorId; }));
    if (!actors.length) { board.innerHTML = '<p class="text-muted">No actor data available</p>'; return; }
    board.innerHTML = actors.map(function(id) {
      var state    = getActorStateAt(id, t, npcChanges);
      var typeStr  = (npcChanges.find(function(c){ return c.actorId === id; }) || {}).actorType || '';
      var sCls     = 'as-' + (state||'').toLowerCase().replace(/\s+/g,'');
      return '<div class="actor-card">' +
        '<div class="actor-id">' + esc(id) + ' <span style="color:var(--border)">[' + esc(typeStr) + ']</span></div>' +
        '<div class="actor-state ' + sCls + '">' + esc(state||'Unknown') + '</div>' +
      '</div>';
    }).join('');
  }

  function getActorStateAt(actorId, t, npcChanges) {
    var hist = npcChanges
      .filter(function(c){ return c.actorId === actorId && c.timestamp <= t; })
      .sort(function(a,b){ return a.timestamp - b.timestamp; });
    if (hist.length) return hist[hist.length-1].newState;
    var first = npcChanges.find(function(c){ return c.actorId === actorId; });
    return first ? first.previousState : 'Unknown';
  }

  function updateActiveEvents(t) {
    var list = document.getElementById('active-events-list');
    if (!list) return;
    var near = (S.events || []).filter(function(e){ return Math.abs(e.timestamp - t) <= 2; });
    if (!near.length) { list.innerHTML = '<p class="text-muted">No events in ±2 s window</p>'; return; }
    list.innerHTML = near.map(function(e) {
      var col = catColor(getEvtCat(e.eventType));
      return '<div class="active-event-item" style="border-left-color:' + col + '">' +
        '<span style="font-family:\'Courier New\',monospace;color:' + col + '">' + formatTime(e.timestamp) + '</span>' +
        '&nbsp; <strong>' + esc(e.eventType) + '</strong>' +
        (e.roomId        ? '&nbsp;<span style="color:var(--muted)">@ ' + esc(e.roomId) + '</span>' : '') +
        (e.sourceActorId ? '&nbsp;<span style="color:var(--muted)">' + esc(e.sourceActorId) + '</span>' : '') +
      '</div>';
    }).join('');
  }

  function updateNPCLog(t) {
    var tbody = document.getElementById('npc-log-body');
    if (!tbody) return;
    var changes = (S.npcStateChanges || [])
      .filter(function(c){ return c.timestamp <= t + 2; })
      .sort(function(a,b){ return b.timestamp - a.timestamp; }); // newest first
    if (!changes.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No state changes in this window</td></tr>';
      return;
    }
    tbody.innerHTML = changes.map(function(c) {
      var hi = Math.abs(c.timestamp - t) <= 2;
      return '<tr style="' + (hi ? 'background:rgba(31,111,235,0.1)' : '') + '">' +
        '<td style="font-family:\'Courier New\',monospace;white-space:nowrap">' + formatTime(c.timestamp) + '</td>' +
        '<td>' + esc(c.actorId||'') + '</td>' +
        '<td style="color:var(--muted);font-size:0.8rem">' + esc(c.actorType||'') + '</td>' +
        '<td style="color:var(--muted)">' + esc(c.previousState||'—') + '</td>' +
        '<td><strong style="color:var(--accent)">' + esc(c.newState||'—') + '</strong></td>' +
        '<td style="font-size:0.8rem;color:var(--muted)">' + esc(c.triggerEvent||'—') + '</td>' +
      '</tr>';
    }).join('');
  }

  /* ──────────────────────────────────────────
     INCIDENT FILTER & HIGHLIGHT
  ────────────────────────────────────────── */
  function filterInc(sev, btn) {
    document.querySelectorAll('.filter-bar .btn').forEach(function(b){ b.classList.remove('active-filter'); });
    btn.classList.add('active-filter');
    document.querySelectorAll('#inc-tbody tr').forEach(function(row) {
      row.style.display = (sev === 'all' || row.dataset.sev === sev) ? '' : 'none';
    });
  }

  function highlightInc(idx) {
    document.querySelectorAll('.incident-row').forEach(function(r, i) {
      r.classList.toggle('highlighted', i === idx);
    });
  }

  /* ──────────────────────────────────────────
     COPY SESSION ID
  ────────────────────────────────────────── */
  function copySessionId() {
    var id = (S && S.sessionId) ? S.sessionId : '';
    if (!id) return;
    var btn = document.getElementById('copy-id-btn');
    var orig = btn ? btn.textContent : '';
    function done() { if (btn) { btn.textContent = '✓ Copied'; setTimeout(function(){ btn.textContent = orig; }, 1500); } }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(id).then(done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = id;
      ta.style.position = 'fixed';
      ta.style.opacity  = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); done(); } catch(e) {}
      document.body.removeChild(ta);
    }
  }

  /* ──────────────────────────────────────────
     UTILITIES
  ────────────────────────────────────────── */
  function formatTime(s) {
    var sec = Math.max(0, s || 0);
    var m = Math.floor(sec / 60);
    var r = Math.floor(sec % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function pct(v) {
    return Math.round(Math.max(0, Math.min(1, v || 0)) * 100) + '%';
  }

  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g,  '&amp;')
      .replace(/</g,  '&lt;')
      .replace(/>/g,  '&gt;')
      .replace(/"/g,  '&quot;')
      .replace(/'/g,  '&#39;');
  }

  function uniqueVals(arr) {
    var seen = {}, out = [];
    arr.forEach(function(v){ if (!seen[v]) { seen[v] = true; out.push(v); } });
    return out;
  }

  function getEvtCat(type) {
    if (['ShotFired','TerroristHit','TerroristDown','GunshotHeard','AllyDownSeen'].indexOf(type) >= 0) return 'combat';
    if (['DoorOpened','RoomBreached'].indexOf(type) >= 0)                                              return 'door';
    if (['HostageContactStarted','HostageFreed'].indexOf(type) >= 0)                                   return 'hostage';
    if (['PlayerSeen'].indexOf(type) >= 0)                                                             return 'npc';
    return 'other';
  }

  function catColor(cat) {
    return { combat:'#f85149', door:'#d29922', hostage:'#3fb950', npc:'#1f6feb', other:'#8b949e' }[cat] || '#8b949e';
  }

  /* ──────────────────────────────────────────
     GLOBAL EXPOSURE (for inline onclick attrs)
  ────────────────────────────────────────── */
  window.showTab      = showTab;
  window.filterInc    = filterInc;
  window.highlightInc = highlightInc;
  window.setSpeed     = setSpeed;

})();
</script>
</body>
</html>
